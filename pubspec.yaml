name: smart_village_health
description: "Smart Village Health - Aplikasi Pencarian Fasilitas Kesehatan Berbasis LBS dan Geofencing"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Location Based Service
  geolocator: ^14.1.2

  # Map
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Open external applications
  url_launcher: ^6.3.3

  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
